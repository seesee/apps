Hombre is a single-file browser home page. Users add "custom widgets": small
JavaScript modules stored in the browser and rendered inside a resizable
panel on a grid. Write one widget that follows every rule below.

## 1. What to return

Return ONE fenced JSON block, nothing else inside it, shaped exactly like:

\`\`\`json
{
  "name": "Short widget name",
  "source": "export default function ({ root, config, getState, setState, onConfigChange }) { /* ... */ return { destroy() {} }; }",
  "configSchema": [
    { "key": "title", "label": "Title", "type": "text" }
  ]
}
\`\`\`

- \`name\`: 1–40 characters.
- \`source\`: the widget code as ONE JSON string. Use ordinary JSON escaping
  only: a newline is the two characters backslash-n, a double quote is
  backslash-quote. Do not escape twice (never backslash-backslash-n).
- \`configSchema\`: the settings fields the user can edit (may be \`[]\`).

The user pastes that JSON into Hombre (Settings → Custom widgets → Paste
widget JSON). ALSO show the same code in a normal \`\`\`js block and the
schema in a \`\`\`json block: Hombre can import from those two blocks too, so
if the JSON string escaping goes wrong nothing is lost.

## 2. The code contract

The source must \`export default\` a factory function (a bare \`return fn\` is
also accepted). Hombre calls it once per widget instance:

\`\`\`js
export default function ({ root, config, getState, setState, onConfigChange }) {
  // render into root ...
  return { destroy() { /* clear timers, listeners, observers */ } };
}
\`\`\`

Arguments:
- \`root\` — an empty HTMLElement that fills the widget body. Render into it
  (innerHTML, DOM APIs, or a tiny render function). It already has
  \`data-widget="<instance id>"\`, height 100%, and scrolls if content overflows.
- \`config\` — plain object of the user's current settings, keyed by
  \`configSchema[].key\`. Missing keys are undefined; supply defaults with \`??\`.
- \`getState()\` — returns a plain copy of this instance's persisted state
  ({} at first). Each widget instance has its own state; duplicating a widget
  copies it.
- \`setState(obj)\` — replaces and persists that object (JSON only, keep it
  small; it lives in localStorage alongside everything else, ~5 MB total).
  It does NOT re-render, re-mount, or call onConfigChange: update the DOM
  yourself after calling it.
- \`onConfigChange(cb)\` — register \`cb(newConfig)\`; called only when the user
  edits this widget's settings. Update \`cfg\` and re-render from it.

Return value: an object with optional \`destroy()\`. It is called when the
widget is removed or re-mounted after its code is edited. Nothing runs
when the tab closes, so persist as you go.
The factory may be \`async\`. Errors thrown by the factory (sync or async)
are caught and shown inside the widget with an "Edit code" button. Errors
thrown later, inside timers or event handlers, are NOT caught: wrap that
code in try/catch and show the message inside \`root\`.

Lifecycle: the factory runs once per page load and once more after each
code edit. Nothing runs between visits. For anything time-based (timers,
countdowns, polling) store an absolute timestamp such as
\`Date.now() + ms\` in state and derive the remaining time from it, so a
reload or a second tab shows the right value.

## 3. Settings fields (configSchema)

Each entry: \`{ key, label, type, help? }\`. Types:
- \`text\`, \`textarea\`, \`number\` (with optional \`min\`, \`max\`, \`step\`),
  \`boolean\`, \`colour\` (CSS colour string)
- \`select\` with \`options: [{ value, label }]\`
- \`links\` → value is \`[{ label, url }]\`
- \`zones\` → value is \`[{ label, timezone }]\` (IANA zone ids)
- \`timezone\` → value is an IANA zone id string, or "" for local
- \`events\` → value is \`[{ label, date: "YYYY-MM-DD", time?: "HH:MM" }]\`

Prefer settings over hard-coded values for anything a user might want to
change (a URL, a name, a count, a colour).

## 4. Environment and constraints

- Runs in the page (no iframe sandbox), modern browsers, ES2022+, no
  build step, no imports: \`import\` / \`require\` are NOT available.
  Do not load external scripts or stylesheets; keep it self-contained.
- The page may be served from file://. \`fetch\` to other origins works only
  if that origin sends CORS headers, and there is no proxy. Prefer offline
  behaviour; if you must fetch, handle failure visibly inside \`root\` and
  never spam requests (poll no faster than every 60 s, clear timers in
  \`destroy\`).
- Do not touch anything outside \`root\` (no document.body edits, no global
  key handlers, no changing document.title). Do not use alert/confirm/prompt.
- Do not store secrets; everything is plain text in localStorage.
- Keep the code under ~150 lines. No frameworks.

## 5. Look and feel

The widget sits in a panel that follows the user's theme. Use the CSS
variables instead of hard-coded colours so light and dark modes both work:
- \`var(--hb-fg)\` text, \`var(--hb-bg)\` page, \`var(--hb-panel)\` panel,
  \`var(--hb-border)\`, \`var(--hb-hover)\` subtle fill, \`var(--hb-muted)\`
  secondary text, \`var(--hb-accent)\` highlight colour, \`var(--hb-font)\`.
- Ready-made classes: \`hb-btn\` (button), \`hb-btn-primary\`, \`hb-btn-danger\`,
  \`hb-icon-btn\`, \`hb-input\` (text inputs/selects/textareas), \`hb-checkbox\`.
- Scope any extra CSS to the widget: put a \`<style>\` inside \`root\` and prefix
  selectors with \`[data-widget="\${root.dataset.widget}"]\`.
- Panels are usually 2–6 grid cells wide (each ~80–130 px) and 2–4 rows tall
  (80 px each). Use flexible layouts (flex/grid, %, rem) and let content
  scroll rather than overflow. Text should read well at 14 px.
- Show an empty/loading/error state as text inside \`root\`, never silently blank.

## 6. Keyboard and accessibility

Users can give any widget a shortcut key in its settings; pressing it on
the page (outside a text box) focuses the widget. Mark the element that
should receive that focus with \`data-hotkey-target\` (for example the main
text input); otherwise the first focusable control is used. Do not add
your own document-level key listeners.

Users move between widgets with Tab and step into one with Enter. Inside the
widget: use real \`<button>\`/\`<input>\`/\`<a>\` elements so they are tabbable,
give icon-only buttons \`aria-label\`, keep a visible focus ring (the default
outline is fine), and prefer arrow keys for moving within lists. Do not trap
focus. In the page's edit mode the widget body ignores pointer events, which
is normal.

## 7. Complete example

\`\`\`js
export default function ({ root, config, getState, setState, onConfigChange }) {
  let cfg = config;
  const id = root.dataset.widget;
  root.innerHTML = \`
    <style>
      [data-widget="\${id}"] .wrap { display:flex; flex-direction:column; gap:.5rem; height:100%; }
      [data-widget="\${id}"] .big { font-size:2.5rem; font-weight:600; line-height:1; color:var(--hb-accent); }
    </style>
    <div class="wrap">
      <div class="big" data-count>0</div>
      <div style="color:var(--hb-muted);font-size:.85rem" data-label></div>
      <div style="display:flex;gap:.25rem">
        <button class="hb-btn hb-btn-primary" data-inc aria-label="Increase">+1</button>
        <button class="hb-btn" data-reset>Reset</button>
      </div>
    </div>\`;
  const $ = (s) => root.querySelector(s);
  const render = () => {
    $('[data-count]').textContent = getState().count ?? 0;
    $('[data-label]').textContent = cfg.label ?? 'Counter';
  };
